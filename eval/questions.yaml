# Gold-standard evaluation set, built from the personal knowledge base's
# top-level index page.
# `expected` lists document slugs (order-insensitive), matching the `doc_slug`
# field produced by src/loader.py. Contains no vault content — safe to publish.

questions:
  # --- direct factual (10) ---
  - id: q01
    question: "ROC eğrisi neden eşikten bağımsız bir metrik?"
    expected: [roc-auc]
    type: direct

  - id: q02
    question: "Wilson Lower Bound ne işe yarar?"
    expected: [wilson-lower-bound]
    type: direct

  - id: q03
    question: "RFM analizinde Recency, Frequency, Monetary neyi ölçer?"
    expected: [rfm-analizi]
    type: direct

  - id: q04
    question: "CART algoritması nasıl if/else kural zincirine dönüşür?"
    expected: [cart-algoritmasi]
    type: direct

  - id: q05
    question: "K-fold cross validation nedir ve neden holdout'tan daha güvenilir?"
    expected: [cross-validation]
    type: direct

  - id: q06
    question: "PCA boyut indirgemeyi nasıl yapar?"
    expected: [pca]
    type: direct

  - id: q07
    question: "IQR yöntemiyle aykırı değerler nasıl tespit edilir?"
    expected: [aykiri-degerler-iqr]
    type: direct

  - id: q08
    question: "Association Rule Learning'de support, confidence ve lift ne anlama gelir?"
    expected: [association-rule-learning]
    type: direct

  - id: q09
    question: "Gradient descent'te learning rate neyi kontrol eder?"
    expected: [gradient-descent]
    type: direct

  - id: q10
    question: "KNN neden 'lazy learner' olarak adlandırılır?"
    expected: [knn-algoritmasi]
    type: direct

  # --- paraphrase, no keyword overlap (6) ---
  - id: q11
    question: "Modelim %95 doğruluk veriyor ama işe yaramıyor, neden olabilir?"
    expected: [dengesiz-veri-setleri, imbalanced-datasets, siniflandirma-metrikleri]
    type: paraphrase
    note: "'imbalanced' veya 'accuracy' kelimesi geçmiyor — semantic match testi. 'imbalanced-datasets' vault'ta aynı konunun source-sayfası (concept sayfası 'dengesiz-veri-setleri' farklı slug taşıyor) -- ikisi de doğru kabul edilir, bkz. results/disagreement_analysis.md"

  - id: q12
    question: "Elimde etiket yok, müşterileri gruplara nasıl ayırabilirim?"
    expected: [k-means, unsupervised-learning]
    type: paraphrase
    note: "'clustering' veya 'kümeleme' kelimesi kullanılmadı"

  - id: q13
    question: "Kategorik bir sütunu modele sayısal olarak nasıl veririm?"
    expected: [encoding-yontemleri]
    type: paraphrase
    note: "'encoding' kelimesi geçmiyor"

  - id: q14
    question: "Bir kullanıcının geçmiş alışverişine bakıp gelecekte ne kadar harcayacağını nasıl tahmin ederim?"
    expected: [bg-nbd-gamma-gamma, cltv-formul]
    type: paraphrase
    note: "'CLTV' terimi kullanılmadı"

  - id: q15
    question: "Farklı büyüklükteki sayısal sütunları model için nasıl aynı ölçeğe getiririm?"
    expected: [feature-scaling]
    type: paraphrase
    note: "'scaling' kelimesi geçmiyor"

  - id: q16
    question: "Eğitim setinde çok iyi ama gerçek veride kötü sonuç veren bir model neyle açıklanır?"
    expected: [cross-validation, cart-algoritmasi]
    type: paraphrase
    note: "'overfitting' kelimesi kullanılmadı"

  # --- multi-document (5) ---
  - id: q17
    question: "Ağaçları paralel kurmakla sırayla kurmak arasındaki fark nedir?"
    expected: [random-forest-algoritmasi, gbm-boosting-algoritmasi, advanced-trees]
    primary: random-forest-algoritmasi
    type: multi_doc
    note: "bagging vs boosting karşılaştırması"

  - id: q18
    question: "Precision, Recall ve F1 skoru arasındaki ilişki nedir, ROC-AUC ile nasıl farklılaşır?"
    expected: [siniflandirma-metrikleri, roc-auc]
    primary: siniflandirma-metrikleri
    type: multi_doc

  - id: q19
    question: "Denetimsiz öğrenmede kümeleme sonrası boyut indirgeme neden birlikte kullanılır?"
    expected: [k-means, pca, unsupervised-learning]
    primary: unsupervised-learning
    type: multi_doc

  - id: q20
    question: "İçerik tabanlı ve işbirlikçi filtreleme öneri sistemleri nasıl farklılaşır?"
    expected: [icerik-tabanli-tavsiye, isbirligi-filtreleme]
    primary: icerik-tabanli-tavsiye
    type: multi_doc

  - id: q21
    question: "Eksik değerleri doldurmanın farklı yöntemleri nelerdir ve outlier tespitiyle nasıl ilişkilidir?"
    expected: [eksik-deger-yontemleri, aykiri-degerler-iqr, lof-local-outlier-factor]
    primary: eksik-deger-yontemleri
    type: multi_doc

